#!/bin/bash
# =============================================================================
# toolkit.conf -- Parrot HTB Toolkit Installation Config
# =============================================================================
#
# This file controls exactly what gets installed by install-toolkit.sh.
# It is sourced as a bash script at the start of the install.
#
# HOW TO USE:
#   Basic:    Just run the installer. Toggle categories in the interactive menu.
#   Advanced: Edit this file before running to control individual tools.
#             - Remove a package name to skip it
#             - Add package names to install extras (must be valid apt/pip names)
#             - Set INSTALL_XXX=false to skip tools with custom install logic
#
# TIP: 'apt-cache search <keyword>' to find package names
# TIP: 'pip3 search <keyword>' to find pip packages (or just check PyPI)
#
# KeePassXC always installs by default. Set INSTALL_KEEPASSXC=false to skip it.
# (You really shouldn't. But it's your machine.)
# =============================================================================

INSTALL_KEEPASSXC=true   # set false if you really know what you're doing

# =============================================================================
# GUI DESKTOP ENVIRONMENT
# X11 display server + XFCE4 desktop + XRDP + audio + themes
# =============================================================================
GUI_APT=(
    # X11 display server
    xorg
    xserver-xorg
    x11-apps
    x11-utils
    x11-xserver-utils
    dbus-x11
    xdg-utils
    mesa-utils

    # XFCE4 desktop (lightweight, works great in WSL)
    xfce4
    xfce4-goodies
    xfce4-terminal
    xfce4-whiskermenu-plugin
    thunar
    mousepad
    ristretto

    # XRDP (remote desktop — connect via mstsc /v:localhost:3390)
    xrdp

    # Audio
    pulseaudio

    # Themes and fonts — making it look less like 2004
    arc-theme
    papirus-icon-theme
    fonts-noto
    fonts-hack
    fonts-liberation
    adwaita-icon-theme
    gtk2-engines-murrine
    qt5ct

    # Extra terminals
    terminator
)

# =============================================================================
# DESKTOP APPS  (optional -- the stuff you might not want)
# KeePassXC is NOT here -- it always installs silently.
# =============================================================================
APPS_APT=(
    filezilla        # FTP/SFTP client
    flameshot        # screenshot tool (great for writeups)
    vlc              # media player
    evince           # PDF viewer
    libreoffice-calc # spreadsheet (loot parsing, pivot tables on AD data)
    gedit            # GUI text editor
)
INSTALL_BRAVE=true   # Brave browser -- adds its own apt repo, set false to skip

# =============================================================================
# PHASE 1: RECONNAISSANCE
# =============================================================================
RECON_APT=(
    nmap
    masscan
    recon-ng
    amass
    dnsrecon
    dnsenum
    whois
    fierce
    sublist3r
)
RECON_PIP=(
    theHarvester
    sherlock-project
    holehe
    shodan
    spiderfoot
    ghunt
)
INSTALL_PHOTON=true    # web crawler -- git clone from s0md3v/Photon

# =============================================================================
# PHASE 2: SCANNING & ENUMERATION
# =============================================================================
SCAN_APT=(
    enum4linux
    smbclient
    smbmap
    snmp
    onesixtyone
    nbtscan
    ldap-utils
    samba-common-bin   # provides rpcclient
    gobuster
    feroxbuster
    dirb
    nikto
    whatweb
)
INSTALL_RUSTSCAN=true  # fast port scanner -- .deb from GitHub releases
INSTALL_FFUF=true      # web fuzzer -- go install

# =============================================================================
# PHASE 3: VULNERABILITY ANALYSIS
# =============================================================================
VULN_APT=(
    exploitdb
    lynis
)
# legion not in Parrot repos -- set to false, will warn with manual install URL
INSTALL_LEGION=false   # https://github.com/GoVanguard/legion

# =============================================================================
# PHASE 4: WEB APPLICATION TESTING
# =============================================================================
WEB_APT=(
    sqlmap
    wfuzz
    wpscan
    commix
    zaproxy    # OWASP ZAP (GUI -- needs GUI category ON to be useful)
    wafw00f
    burpsuite
)
WEB_PIP=(
    xsstrike
)
INSTALL_JWT_TOOL=true  # git clone from ticarpi/jwt_tool
INSTALL_TPLMAP=true    # git clone from epinna/tplmap (SSTI exploitation)

# =============================================================================
# PHASE 5: EXPLOITATION
# =============================================================================
EXPLOIT_APT=(
    metasploit-framework
    evil-winrm
    responder
    swaks
)
EXPLOIT_PIP=(
    netexec       # crackmapexec successor
    pwncat-cs
    certipy-ad
)
INSTALL_IMPACKET=true    # tries apt (python3-impacket) first, pip fallback
INSTALL_KERBRUTE=true    # binary from GitHub ropnop/kerbrute
INSTALL_NISHANG=true     # PowerShell scripts -- git clone samratashok/nishang

# =============================================================================
# PHASE 6: PASSWORD ATTACKS
# =============================================================================
PASS_APT=(
    john
    hashcat
    hydra
    cewl
    crunch
    hash-identifier
    wordlists
)
PASS_PIP=(
    hashid
)
INSTALL_SECLISTS=true    # tries apt first, git clone danielmiessler/SecLists fallback

# =============================================================================
# PHASE 7: POST-EXPLOITATION
# =============================================================================
POST_APT=(
    bloodhound
    neo4j
    socat
    proxychains4
    sshuttle
)
POST_PIP=(
    pypykatz
)
INSTALL_CHISEL=true      # go install jpillora/chisel
INSTALL_DNSCAT2=true     # git clone iagox86/dnscat2
INSTALL_PEAS=true        # download linpeas.sh + winPEASx64.exe from peass-ng
INSTALL_PSPY=true        # download pspy64 binary from DominicBreuker/pspy
INSTALL_LIGOLO=true      # download ligolo-ng proxy + agent from nicocha30/ligolo-ng

# =============================================================================
# PHASE 8: REVERSE ENGINEERING
# =============================================================================
REVENG_APT=(
    ghidra
    radare2
    gdb
    gdb-peda
    ltrace
    strace
    binwalk
)
REVENG_PIP=(
    pwntools
)

# =============================================================================
# PHASE 9: FORENSICS & STEGO
# =============================================================================
FORENSICS_APT=(
    foremost
    steghide
    exiftool
    testdisk
    pdfid
    pdf-parser
    hexedit
    xxd
    autopsy    # GUI forensics platform (needs GUI category ON)
)
FORENSICS_PIP=(
    stegoveritas
)
INSTALL_STEGSEEK=true      # fast steghide cracker -- .deb from RickdeJager/stegseek
INSTALL_VOLATILITY3=true   # memory forensics -- git clone volatilityfoundation/volatility3

# =============================================================================
# PHASE 10: WIRELESS  (limited in WSL -- no raw WiFi access)
# Installs anyway for when you boot into real hardware
# =============================================================================
WIRELESS_APT=(
    aircrack-ng
    reaver
    wifite
)

# =============================================================================
# NETWORKING & UTILITIES
# The stuff you'll use every single session without thinking about it
# =============================================================================
NET_APT=(
    tcpdump
    wireshark
    tshark
    netcat-openbsd
    rlwrap
    tmux
    vim
    tree
    ftp
    telnet
    redis-tools
    default-mysql-client     # renamed in Debian 13 (was mysql-client)
    postgresql-client
    openvpn                  # for HTB VPN
    remmina                  # GUI RDP/VNC client
    remmina-plugin-rdp
    remmina-plugin-vnc
)
