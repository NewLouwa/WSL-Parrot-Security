# /etc/wsl.conf — WSL Configuration
# Copy this file to /etc/wsl.conf inside your Parrot WSL instance
# Then restart WSL: wsl --shutdown (from PowerShell)
#
# !! EDIT THE [user] SECTION BELOW TO MATCH YOUR SETUP !!

[boot]
systemd=true

[user]
# CHANGE THIS to your non-root username
default=YOUR_USERNAME

[interop]
enabled=true
appendWindowsPath=true

[automount]
enabled=true
options="metadata,uid=1000,gid=1000,umask=22,fmask=11"
mountFsTab=true

[network]
generateResolvConf=true
